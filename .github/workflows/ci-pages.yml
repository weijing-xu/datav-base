name: CI & Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --workspace-concurrency=1 run build
      - run: pnpm -r --workspace-concurrency=1 run typecheck
      - name: Build demos for GitHub Pages
        run: |
          pnpm -C apps/react-demo exec vite build --base=/datav-base/react/
          pnpm -C apps/vue-demo exec vite build --base=/datav-base/vue/
          mkdir -p dist-pages/react dist-pages/vue
          cp -r apps/react-demo/dist/. dist-pages/react/
          cp -r apps/vue-demo/dist/. dist-pages/vue/
          cp apps/pages-landing/index.html dist-pages/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
